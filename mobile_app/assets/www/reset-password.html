<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redefinir Senha - KL Web</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="stylesheet" href="core.min.css?v=20260930">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body style="display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #f8fafc;">

    <div class="auth-card" style="width: 100%; max-width: 420px; padding: 2.5rem; background: #ffffff; border-radius: 12px; border: 1px solid #e2e8f0; box-shadow: 0 4px 20px rgba(0,0,0,0.08);">
        <div style="text-align: center; margin-bottom: 2rem;">
            <span class="badge" style="background: rgba(14, 165, 233, 0.1); color: #0ea5e9; padding: 0.4rem 0.8rem; border-radius: 20px; font-size: 0.8rem;"><i class="fa-solid fa-layer-group"></i> KL WEB</span>
            <h2 style="color: #0f172a; font-size: 1.8rem; margin-top: 1rem;">Criar Nova Senha</h2>
            <p style="color: #64748b; font-size: 0.9rem; margin-top: 0.5rem;">Digite sua nova senha de acesso abaixo.</p>
        </div>

        <form id="reset-password-form">
            <input type="hidden" id="reset-token-field">
            
            <div class="form-group" style="margin-bottom: 1.25rem;">
                <label for="new-password" style="color: #475569; font-size: 0.85rem; display: block; margin-bottom: 0.5rem;"><i class="fa-solid fa-lock"></i> Nova Senha</label>
                <input type="password" id="new-password" name="new-password" placeholder="Digite a nova senha (mín. 4 caracteres)" required style="width: 100%; padding: 0.75rem; background: #f1f5f9; border: 1px solid #e2e8f0; color: #0f172a; border-radius: 6px;">
            </div>

            <div class="form-group" style="margin-bottom: 1.5rem;">
                <label for="confirm-password" style="color: #475569; font-size: 0.85rem; display: block; margin-bottom: 0.5rem;"><i class="fa-solid fa-lock"></i> Confirmar Nova Senha</label>
                <input type="password" id="confirm-password" name="confirm-password" placeholder="Confirme a nova senha" required style="width: 100%; padding: 0.75rem; background: #f1f5f9; border: 1px solid #e2e8f0; color: #0f172a; border-radius: 6px;">
            </div>

            <button type="submit" id="btn-submit-reset" style="width: 100%; padding: 0.85rem; background: #0ea5e9; color: #fff; border: none; border-radius: 6px; font-weight: 600; cursor: pointer;">
                <i class="fa-solid fa-key"></i> Redefinir Senha
            </button>
        </form>

        <div id="reset-msg" style="margin-top: 1rem; text-align: center; font-size: 0.9rem; display: none;"></div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');
            
            console.log('Token recebido na URL:', token);
            
            if (!token) {
                const msgBox = document.getElementById('reset-msg');
                msgBox.style.color = '#f87171';
                msgBox.innerText = 'Token não encontrado na URL. Por favor, use o link enviado por email.';
                msgBox.style.display = 'block';
                return;
            }
            
            document.getElementById('reset-token-field').value = token;

            const form = document.getElementById('reset-password-form');
            const msgBox = document.getElementById('reset-msg');

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const newPassword = document.getElementById('new-password').value;
                const confirmPassword = document.getElementById('confirm-password').value;

                if (newPassword.length < 4) {
                    msgBox.style.color = '#f87171';
                    msgBox.innerText = 'A nova senha deve ter pelo menos 4 caracteres.';
                    msgBox.style.display = 'block';
                    return;
                }

                if (newPassword !== confirmPassword) {
                    msgBox.style.color = '#f87171';
                    msgBox.innerText = 'A confirmação não coincide com a nova senha.';
                    msgBox.style.display = 'block';
                    return;
                }

                const btnSubmit = document.getElementById('btn-submit-reset');
                btnSubmit.disabled = true;
                btnSubmit.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Processando...';

                try {
                    const response = await fetch('/api/auth/reset-password', {
                        method: 'POST', 
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ token: token, newPassword: newPassword })
                    });
                    const data = await response.json();

                    console.log('Resposta do servidor:', data);

                    if (response.ok && data.success) {
                        msgBox.style.color = '#4ade80';
                        msgBox.innerText = 'Senha redefinida com sucesso no banco de dados! Redirecionando para o login...';
                        msgBox.style.display = 'block';
                        setTimeout(() => window.location.href = '/', 2500);
                    } else {
                        msgBox.style.color = '#f87171';
                        msgBox.innerText = data.message || 'Erro ao redefinir senha.';
                        msgBox.style.display = 'block';
                        btnSubmit.disabled = false;
                        btnSubmit.innerHTML = '<i class="fa-solid fa-key"></i> Redefinir Senha';
                    }
                } catch (err) {
                    console.error('Erro ao redefinir senha:', err);
                    msgBox.style.color = '#f87171';
                    msgBox.innerText = 'Erro ao conectar ao servidor.';
                    msgBox.style.display = 'block';
                    btnSubmit.disabled = false;
                    btnSubmit.innerHTML = '<i class="fa-solid fa-key"></i> Redefinir Senha';
                }
            });
        });
    </script>
</body>
</html>
